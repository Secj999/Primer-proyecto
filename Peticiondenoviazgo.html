<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Una propuesta especial en español para alguien muy especial.">
    <title>Para Daniela 💕</title>
    <style>
        :root {
            --rosa-1: #f72585;
            --rosa-2: #ff4fa3;
            --rosa-3: #ff80ab;
            --text-dark: #1f1f2e;
            --text-muted: #66666f;
            --blanco: #ffffff;
            --sombra: rgba(0, 0, 0, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #160309 0%, #06070c 45%, #000000 100%);
            overflow-x: hidden;
            color: var(--text-dark);
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(90vw, 760px);
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 35px;
            border-radius: 30px;
            box-shadow: 0 24px 60px var(--sombra);
            animation: floatIn 1s ease-out;
        }

        @keyframes floatIn {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .heart {
            display: inline-block;
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 18px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.18); }
        }

        h1 {
            font-size: clamp(1.6rem, 3vw, 2.6rem);
            line-height: 1.3;
            margin-bottom: 14px;
            color: #1b1b3a;
        }

        p {
            color: var(--text-muted);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 15px 38px;
            font-size: clamp(1rem, 2vw, 1.35rem);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            font-family: inherit;
        }

        .btn:focus-visible {
            outline: 3px solid #5a8dff;
            outline-offset: 3px;
        }

        .btn-yes {
            background: linear-gradient(135deg, var(--rosa-1), var(--rosa-2));
            color: var(--blanco);
            box-shadow: 0 10px 25px rgba(247, 37, 133, 0.38);
        }

        .btn-yes:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 12px 30px rgba(247, 37, 133, 0.5);
        }

        .btn-no {
            background: #f3f3f7;
            color: var(--text-muted);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        }

        .btn-no:hover {
            background: #ececf2;
            transform: translateY(-2px);
        }

        .celebration {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #090405 0%, #2b0c1d 25%, #0d0d0d 100%);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
            padding: 24px;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .celebration.active {
            display: flex;
        }

        .celebration h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            color: #fff;
            margin-bottom: 18px;
        }

        .celebration p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: #ffbfd3;
            margin-bottom: 26px;
        }

        .big-heart {
            font-size: clamp(4rem, 10vw, 8rem);
            animation: heartbeat 0.8s infinite;
            margin-bottom: 24px;
        }

        .floating-hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-hearts span {
            position: absolute;
            animation: floatHeart linear infinite;
            opacity: 0.35;
            user-select: none;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.35;
            }
            90% {
                opacity: 0.35;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        .sad-face {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            animation: sadFall linear forwards;
            user-select: none;
        }

        @keyframes sadFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(70vh) rotate(180deg);
                opacity: 0;
            }
        }

        .crying-cat {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(5rem, 15vw, 10rem);
            z-index: 300;
            pointer-events: none;
            animation: catPop 2s ease forwards;
            user-select: none;
        }

        @keyframes catPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            30% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
            60% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) translateY(40px);
                opacity: 0;
            }
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 200;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 22px;
                border-radius: 24px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

    <main class="container" id="mainCard">
        <div class="heart" aria-hidden="true">💖</div>
        <h1>¿Daniela, quieres ser mi novia?</h1>
        <p>Piensa con el corazón...</p>

        <div class="buttons">
            <button class="btn btn-yes" id="btnYes" type="button">Sí</button>
            <button class="btn btn-no" id="btnNo" type="button">Piénsalo mejor, plis</button>
        </div>
    </main>

    <section class="celebration" id="celebration" aria-live="polite">
        <div class="big-heart" aria-hidden="true">🥰</div>
        <h1>¡Sabía que ibas a decir que sí!</h1>
        <p>Eres lo mejor, te i loviu mucho 💗</p>
        <div class="heart" aria-hidden="true" style="font-size: 80px;">😻</div>
    </section>

    <script>
        const floatingHearts = document.getElementById('floatingHearts');
        const hearts = ['❤️', '💘', '🥰', '💞', '💖'];

        for (let i = 0; i < 18; i++) {
            const span = document.createElement('span');
            span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            span.style.left = Math.random() * 100 + '%';
            span.style.fontSize = (Math.random() * 20 + 16) + 'px';
            span.style.animationDuration = (Math.random() * 10 + 10) + 's';
            span.style.animationDelay = (Math.random() * 8) + 's';
            floatingHearts.appendChild(span);
        }

        const sadFaces = ['😢', '😭', '☹️', '🥺', '💔', '😞'];
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const celebration = document.getElementById('celebration');
        const mainCard = document.getElementById('mainCard');
        let audioContext = null;

        function getAudioContext() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;

                if (!audioContext) {
                    audioContext = new AudioContextClass();
                }

                return audioContext;
            } catch (e) {
                console.warn('AudioContext no disponible:', e);
                return null;
            }
        }

        async function playYesSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                if (ctx.state === 'suspended') {
                    await ctx.resume();
                }

                const now = ctx.currentTime;
                const frequencies = [392.0, 329.63, 293.66];

                frequencies.forEach((frequency, index) => {
                    const oscillator = ctx.createOscillator();
                    const gainNode = ctx.createGain();

                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(frequency, now + index * 0.12);

                    gainNode.gain.setValueAtTime(0.0001, now + index * 0.12);
                    gainNode.gain.exponentialRampToValueAtTime(0.12, now + index * 0.12 + 0.06);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.12 + 0.22);

                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);

                    oscillator.start(now + index * 0.12);
                    oscillator.stop(now + index * 0.12 + 0.22);
                });
            } catch (e) {
                console.warn('Error al reproducir sonido:', e);
            }
        }

        function showSadFaces() {
            const rect = btnNo.getBoundingClientRect();
            const count = 6;

            for (let i = 0; i < count; i++) {
                const face = document.createElement('div');
                face.className = 'sad-face';
                face.textContent = sadFaces[Math.floor(Math.random() * sadFaces.length)];
                face.style.left = (rect.left + btnNo.offsetWidth / 2 + (Math.random() - 0.5) * 70) + 'px';
                face.style.top = (rect.top - 10) + 'px';
                face.style.fontSize = (Math.random() * 20 + 20) + 'px';
                face.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                document.body.appendChild(face);
                setTimeout(() => face.remove(), 4000);
            }
        }

        function showCryingCat() {
            const cat = document.createElement('div');
            cat.className = 'crying-cat';
            cat.textContent = '😿';
            document.body.appendChild(cat);
            setTimeout(() => cat.remove(), 2000);
        }

        function createConfetti() {
            const colors = ['#e91e63', '#ff4081', '#f50057', '#ff80ab', '#ff1744', '#ffd600', '#00e676', '#2979ff'];
            const shapes = ['circle', 'square'];

            for (let i = 0; i < 90; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)] === 'circle' ? '50%' : '0';
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animation = `confettiFall ${Math.random() * 3 + 2}s linear ${Math.random() * 2}s forwards`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        function sayYes() {
            mainCard.style.display = 'none';
            celebration.classList.add('active');
            createConfetti();
        }

        btnNo.addEventListener('mouseover', showSadFaces);
        btnNo.addEventListener('click', showCryingCat);
        btnYes.addEventListener('click', async () => {
            await playYesSound();
            sayYes();
        });
    </script>
</body>
</html>
